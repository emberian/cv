# Publish the library crates to crates.io as part of a release.
#
# Why this file exists: `dist-workspace.toml` used to say `publish-jobs = ["cargo"]`, which
# cargo-dist 0.31 rejects outright ("cargo is not a recognized job value") — it has no built-in
# crates.io job, only `homebrew`, `npm`, and custom `./name` jobs like this one. The bad value made
# the release `plan` step fail before anything was built, so EVERY tag since it was added produced
# no binaries and no crates.io upload. dist calls this job by name from the generated release.yml.
#
# Needs a `CARGO_REGISTRY_TOKEN` repository secret with publish rights on all six crates. It was
# NOT set for v0.11.0: the binaries published fine (84 assets, seven targets) and this job stopped
# with the message below, so crates.io sat at the previous version. Set it with
# `gh secret set CARGO_REGISTRY_TOKEN`, then either re-run this job on the release workflow or
# publish by hand in the order below.
name: Publish to crates.io

on:
  workflow_call:
    inputs:
      # dist passes its whole plan; we only need it to exist for the call to typecheck, but it is
      # handy in the log when a release goes sideways.
      plan:
        required: true
        type: string

jobs:
  publish-crates:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: stable
      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Publish in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          PLAN: ${{ inputs.plan }}
        run: |
          set -uo pipefail
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set; cannot publish to crates.io"
            exit 1
          fi

          # Dependency order: a crate cannot be published before the ones it depends on are live.
          # `cv-sim`, `cv-tui` and `cv-web` are `publish = false` and deliberately absent.
          CRATES="clustervision-core cv-search cv-llm cvd cv-mcp clustervision"

          for c in $CRATES; do
            echo "::group::publish $c"
            # A re-run of a release (or a partially-successful first run) must not fail the job for
            # versions that already landed — crates.io is append-only, so "already uploaded" is the
            # success state, not an error.
            out="$(cargo publish -p "$c" --locked 2>&1)" && status=0 || status=$?
            echo "$out"
            if [ "$status" -ne 0 ]; then
              # Cargo's wording has moved around across versions; match the stable part. Seen in
              # the wild: "crate clustervision-core@0.11.1 already exists on crates.io index"
              # (cargo 1.9x) and "crate version X is already uploaded" (older). Matching only the
              # latter made a re-run of this job fail on crates that had published fine.
              if echo "$out" | grep -qiE 'already exists|already (been )?uploaded|is already (uploaded|published)'; then
                echo "$c is already on crates.io at this version — continuing"
              else
                echo "::error::publishing $c failed"
                echo "::endgroup::"
                exit "$status"
              fi
            fi
            echo "::endgroup::"
          done

          echo "all crates published"
