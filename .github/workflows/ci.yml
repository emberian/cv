name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2

      - name: Build (default features)
        run: cargo build --workspace --all-targets

      - name: Test (default features)
        run: cargo test --workspace

      - name: Build cv-core for wasm config (no default features)
        run: cargo build -p clustervision-core --no-default-features

      # Advisory (don't fail the build) — surfaces nits without blocking.
      - name: Format check
        run: cargo fmt --all --check
        continue-on-error: true

      - name: Clippy
        run: cargo clippy --workspace --all-targets
        continue-on-error: true

  wasm:
    name: wasm build (cv-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Install wasm-pack
        # Official prebuilt-binary installer (Node-free) — replaces jetli/wasm-pack-action, which
        # ran on the now-deprecated Node 20.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Check cv-core on wasm32 (standalone)
        # cv-web enables uuid/js for the whole graph, which can mask a cv-core that doesn't
        # compile for wasm32 on its own (the uuid randomness backend regression class).
        run: cargo check -p clustervision-core --no-default-features --target wasm32-unknown-unknown
      - name: Build cv-web to wasm
        run: wasm-pack build --target web --out-dir /tmp/pkg crates/cv-web -- --no-default-features

  desktop:
    name: desktop app (app/src-tauri)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - name: Tauri v2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # `app/src-tauri` declares its OWN [workspace], so the repo's `--workspace` build never sees
      # it. That is why it sat un-compilable from the 0.10 crate rename until 0.11.0: it asked for
      # a package named `cv-core` that had become `clustervision-core`, and nothing noticed for a
      # whole release. This job is the thing that notices.
      - name: Check
        working-directory: app/src-tauri
        run: cargo check --all-targets
      - name: Test
        working-directory: app/src-tauri
        run: cargo test

  web:
    name: web UI (web/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # `web/` has no build step and no framework, so nothing was ever checking that it parses —
      # or that it still matches the IR. Syntax is the floor; `web/selftest.html` carries the
      # rendering invariants for a human to run.
      - name: Syntax-check every module
        run: |
          set -euo pipefail
          found=0
          for f in web/*.js web/components/*.js; do
            [ -e "$f" ] || continue
            found=$((found + 1))
            node --check "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no web modules found — did the layout move?"
            exit 1
          fi
          echo "checked $found module(s)"
      # A content block is tagged `type` (§4); an EVENT still has a `kind`. This catches the
      # specific regression that broke every transcript screen in 0.11.0.
      - name: No block is read by the pre-0.11.0 tag
        run: |
          set -uo pipefail
          if grep -rnE '\.kind *=== *"(text|thinking|tool_use|tool_result|image|file)"' web/; then
            echo "::error::a content block is tagged 'type', not 'kind' — see docs/INTERFACE-V2.md §4"
            exit 1
          fi
          echo "no stale block-tag reads"
