name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  test:
    name: build · test · clippy · fmt
    runs-on: ubuntu-latest
    steps:
      - name: Isolate cv state
        run: echo "CLUSTERVISION_HOME=$RUNNER_TEMP/cv-ci-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}

      # Gates, cheapest first. Both were `continue-on-error` (advisory) until 0.14; the tree is
      # clean on the pinned toolchain, and the pin is what keeps "clean" a stable predicate.
      - name: Format check
        run: cargo fmt --all --check

      # Product lines per crate and module as drift since the last release tag (annotations, never
      # a failure); no committed evidence files; design docs stay short. The shallow checkout needs
      # the tag; on the release commit itself the tag does not exist yet and the drift is skipped.
      - name: Size drift and repository hygiene
        run: |
          tag=v$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)
          git fetch --no-tags --depth=1 origin "refs/tags/${tag}:refs/tags/${tag}" || echo "::warning::${tag} is not published yet"
          python3 -I tools/check-size.py

      # The corpus generators' shared key proxy (every translator, every generator's own launch
      # line) against a local mock upstream, and scrub.py over a synthetic store. No network.
      - name: Corpus tools
        run: python3 -I tools/harness-corpus/test_tools.py

      - name: Build provenance in linked worktrees and archives
        run: python3 -I tools/test-build-provenance.py

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build (default features)
        run: cargo build --workspace --all-targets

      - name: Compatibility comparator controls
        run: python3 -I tools/test-compatibility.py

      # The released binary, not a rebuild of its tag: the comparator reads both binaries' own
      # contracts (`schema --json` lists the HTTP routes from the routers' tables). Each `--accept`
      # is one reviewed 0.18/0.19 change (manual/src/compatibility.md lists them); they leave with
      # this baseline.
      - name: Compatibility against the released 0.17.0 binary
        shell: bash
        run: |
          baseline=$(mktemp -d "$RUNNER_TEMP/cv-compat-baseline-XXXXXX")
          curl -fsSL --retry 3 https://github.com/emberian/cv/releases/download/v0.17.0/clustervision-x86_64-unknown-linux-gnu.tar.xz -o "$baseline/release.tar.xz"
          echo "fb940a1bfa8b22cf637f7188a30d6e46ed24efd15144a41de4d3c8b3abf44e5b  $baseline/release.tar.xz" | sha256sum -c -
          tar -xJf "$baseline/release.tar.xz" -C "$baseline" --strip-components=1
          python3 -I tools/check-compatibility.py --baseline "$baseline/cv" --candidate target/debug/cv \
            --accept tools \
            --accept commands.mcp \
            --accept commands.scry \
            --accept commands.deferrals \
            --accept commands.adopt.args.agents.required \
            --accept commands.search.args.semantic \
            --accept commands.index.args.semantic \
            --accept commands.pack.args.context_bytes \
            --accept commands.splice.args.generate \
            --accept commands.splice.args.gen_model \
            --accept commands.rewind.args.from_compaction \
            --accept commands.dataset.args.out \
            --accept commands.show.args.around.value_type \
            --accept commands.export.args.around.value_type \
            --accept commands.watch.args.interval.value_type \
            --accept rows.codex.message_count \
            --accept 'routes.GET /api/backlog' \
            --accept 'routes.GET /api/board/*' \
            --accept 'routes.GET /api/channels' \
            --accept 'routes.GET /api/claims/{}' \
            --accept 'routes.GET /api/tasks/debt' \
            --accept 'routes.GET /api/tasks/stats' \
            --accept 'routes.GET /api/who/{}' \
            --accept 'routes.POST /api/task/{}/reopen'

      - name: Upgrade from the released 0.16.1 binary
        shell: bash
        run: |
          baseline=$(mktemp -d "$RUNNER_TEMP/cv-upgrade-baseline-XXXXXX")
          curl -fsSL --retry 3 https://github.com/emberian/cv/releases/download/v0.16.1/clustervision-x86_64-unknown-linux-gnu.tar.xz -o "$baseline/release.tar.xz"
          echo "5dd429825e0c0dbb56c7ebf09fcb2339ff9d43916593dd769d3da89ce95b9540  $baseline/release.tar.xz" | sha256sum -c -
          tar -xJf "$baseline/release.tar.xz" -C "$baseline" --strip-components=1
          python3 -I tools/check-upgrade.py --baseline "$baseline/cv" --candidate target/debug/cv --scratch-parent "$RUNNER_TEMP"

      # One process per test (a test that hangs or aborts takes only itself down). nextest does
      # not run doctests; the second line keeps them.

      - name: Install cargo-nextest
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf -o "$RUNNER_TEMP/nextest.tgz" \
            https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-0.9.136/cargo-nextest-0.9.136-x86_64-unknown-linux-gnu.tar.gz
          echo "a098eed56f2dd88c7fdca1e554a6b99fa1ffbd2a7a1c41b865700112981f6f52  $RUNNER_TEMP/nextest.tgz" | sha256sum -c -
          tar zxf "$RUNNER_TEMP/nextest.tgz" -C "${CARGO_HOME:-$HOME/.cargo}/bin"
      - name: Test (default features)
        run: |
          cargo nextest run --workspace --profile ci
          cargo test --workspace --doc

      # The real Codex, not recorded payloads: the trust verdict from `app-server hooks/list` and
      # the SessionStart/UserPromptSubmit effect of `codex exec`. Neither needs an API key or a model call.
      - name: Codex hooks against the released 0.162.1 binary
        shell: bash
        run: |
          codex=$(mktemp -d "$RUNNER_TEMP/codex-XXXXXX")
          curl -fsSL --retry 3 https://github.com/openai/codex/releases/download/rust-v0.162.1/codex-x86_64-unknown-linux-musl.tar.gz -o "$codex/codex.tar.gz"
          echo "86f268d81b898f3e144c5ecff2ad2fda2c5802e042d6195b72538fe0fa125057  $codex/codex.tar.gz" | sha256sum -c -
          tar -xzf "$codex/codex.tar.gz" -C "$codex"
          mv "$codex/codex-x86_64-unknown-linux-musl" "$codex/codex"
          "$codex/codex" --version
          CV_CODEX_BIN="$codex/codex" cargo nextest run --profile ci -p clustervision --test hooks -E 'test(real_binary) | test(codex_hooks_run_in_the_real)'

      # The parse budget (docs/design/PERF.md): the counting pass over the committed corpus as a
      # ratio to a plain read of the same bytes in the same run, so a slow runner moves both sides.
      - name: Parse budget
        run: cargo test --release -p clustervision-core --test perf_budget -- --ignored corpus

      # Actual generated inputs, one operation per process. Requested live Rust heap is distinct
      # from file-backed RSS; no timing threshold and no native SQLite allocation guarantee.
      - name: Install fixture compression tool
        run: sudo apt-get update && sudo apt-get install -y zstd

      - name: Live Rust heap budget
        run: |
          python3 -I tools/test-heap-budget.py
          cargo build --release -p clustervision-core --example store_probe --features probe-heap
          cp target/release/examples/store_probe /tmp/cv-store-probe-mmap
          cargo build --release -p clustervision-core --example store_probe --no-default-features --features probe-heap
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only active
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only query
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only doctor
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only active --format zed
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only portable-docs
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only selected-docs
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only selected-payloads
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only encoded-arguments
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only stats
          python3 tools/perf-sqlite-check.py --probe /tmp/cv-store-probe-mmap
          python3 tools/perf-sqlite-check.py --probe /tmp/cv-store-probe-mmap --hermes-giant --sizes 16777216 67108864
          python3 tools/perf-sqlite-check.py --probe /tmp/cv-store-probe-mmap --giant-discovery --sizes 16777216 67108864
          cargo build --release -p clustervision-core --example store_probe --no-default-features --features sqlite,probe-heap
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only events
          python3 -I tools/check-heap-budget.py /tmp/cv-store-probe-mmap --no-mmap-probe target/release/examples/store_probe --only portable-selected-payloads

      # Exercises the production worker/tee/channel/Tantivy path, not a queue-only mock.
      # Four 100MB arguments refute the old unbounded queue under the same 384MiB Rust cap.
      - name: Production search heap budgets
        run: |
          probe_root=$(mktemp -d)
          trap 'rm -rf "$probe_root"' EXIT
          mkdir "$probe_root/catalog"
          python3 tools/perf-fixture.py claude "$probe_root/input" --shape sweep-arguments --payload-bytes 100000000
          CV_SWEEP_INPUT_PROBE="$probe_root/input/sweep.jsonl" CV_SWEEP_INPUT_BYTES=100000000 CV_SWEEP_HASH_BODY=1 CLUSTERVISION_HOME="$probe_root/catalog" cargo test -p cv-search --no-default-features --features probe-heap fts::tests::production_sweep_heap_probe -- --ignored --exact --nocapture
          # The live suffix a search reads beside the index: all four giant sessions, read by default.
          CV_SWEEP_INPUT_PROBE="$probe_root/input/sweep.jsonl" CV_SWEEP_INPUT_BYTES=100000000 CLUSTERVISION_HOME="$probe_root/catalog" cargo test -p cv-search --no-default-features --features probe-heap fts::tests::production_live_suffix_heap_probe -- --ignored --exact --nocapture

      - name: Bounded CLI JSON output
        run: cargo test -p clustervision --bin cv --features probe-heap cmd::view::tests::staged_json_selected_payload_heap -- --ignored --exact --test-threads=1 --nocapture

      - name: Whole-operation prune, JSON-window and export heap budgets
        run: |
          python3 -I tools/test-operation-heap.py
          operation_root=$(mktemp -d)
          trap 'rm -rf "$operation_root"' EXIT
          export CLUSTERVISION_HOME="$operation_root/catalog"
          cargo build -j 2 --release -p clustervision-core --example prune_probe --example claude_port_probe --features probe-heap
          cargo test -j 2 -p clustervision --bin cv --features probe-heap --no-run --message-format=json > "$operation_root/window-build.jsonl"
          python3 -I tools/check-operation-heap.py --prune-probe target/release/examples/prune_probe --window-build-report "$operation_root/window-build.jsonl" --claude-port-probe target/release/examples/claude_port_probe

      # Every `cv <cmd>` and MCP tool name the manual mentions exists in `cv schema --commands` or
      # a live `tools/list`. The roster is generated from the clap tree so the binary cannot skew;
      # the manual could, and did (a `formats` tool that is really `formats_census`/`formats_check`;
      # no `task_stats`).
      - name: Manual names exist
        run: tools/check-manual-names.sh target/debug/cv

      # The manual builds, including the pages generated from the binary just built (the command
      # reference and the MCP roster, `tools/mdbook-cv.py`). Until 0.15 only pages.yml built it,
      # after the merge, so a broken SUMMARY or preprocessor failed the deploy and nothing else.
      - name: Install mdBook
        uses: peaceiris/actions-mdbook@ee69d230fe19748b7abf22df32acaa93833fad08 # v2.0.0
        with:
          mdbook-version: '0.5.2'
      - name: Build the manual
        run: mdbook build manual

      # Warnings are errors in every feature configuration, not only the default one.
      - name: Lint cv-core for wasm config (no default features)
        run: cargo clippy -p clustervision-core --no-default-features --all-targets -- -D warnings

      # Native tests do not exercise the positioned (no-mmap) build: its lazy text, source
      # identity and every reader, then the corpus golden read through them.
      - name: Positioned build readers, lazy text and source identity
        run: |
          cargo nextest run --profile ci -p clustervision-core --lib --no-default-features --features sqlite -E 'test(/^(lazy|source|json|watch|stream|harness)::/)'
          cargo nextest run --profile ci -p clustervision-core --test corpus --no-default-features --features sqlite

      # Lint cv-search with default features disabled (`probe-heap` off, all targets).
      - name: Lint cv-search (no default features)
        run: cargo clippy -p cv-search --no-default-features --all-targets -- -D warnings

      # `dist plan` parses dist-workspace.toml and the release matrix without building anything.
      # A bad `publish-jobs` value sat in that file from v0.9.22 until 0.11.0 and every tag in
      # between produced zero artifacts, because the only thing that ever ran `dist plan` was the
      # release workflow itself, after the tag. Same installer and version as release.yml.
      # Every crate we publish must build from its own tarball: a file outside the crate (an
      # include_str! up the tree) builds here and nowhere else, and 0.15.0's CLI crate never
      # reached crates.io because of one.
      - name: Package the published crates
        run: cargo package --workspace --exclude cv-web --exclude cv-testkit

      - name: Install dist
        shell: bash
        run: "curl --proto '=https' --tlsv1.2 -LsSf https://github.com/axodotdev/cargo-dist/releases/download/v0.31.0/cargo-dist-installer.sh | sh"
      - name: dist plan
        run: dist plan --output-format=json > /dev/null && dist plan

  wasm:
    name: wasm build (cv-web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Install wasm-pack
        # Official prebuilt-binary installer (Node-free) — replaces jetli/wasm-pack-action, which
        # ran on the now-deprecated Node 20.
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Check cv-core on wasm32 (standalone)
        # cv-web enables uuid/js for the whole graph, which can mask a cv-core that doesn't
        # compile for wasm32 on its own (the uuid randomness backend regression class).
        run: cargo clippy -p clustervision-core --no-default-features --target wasm32-unknown-unknown -- -D warnings
      - name: Build cv-web to wasm
        run: wasm-pack build --target web --out-dir /tmp/pkg crates/cv-web -- --no-default-features

  desktop:
    name: desktop app (app/src-tauri)
    runs-on: ubuntu-latest
    steps:
      - name: Isolate cv state
        run: echo "CLUSTERVISION_HOME=$RUNNER_TEMP/cv-desktop-home" >> "$GITHUB_ENV"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
        with:
          toolchain: 1.99.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
          workspaces: app/src-tauri
      - name: Tauri v2 system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf \
            libayatana-appindicator3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      # `app/src-tauri` declares its OWN [workspace], so the repo's `--workspace` build never sees
      # it. That is why it sat un-compilable from the 0.10 crate rename until 0.11.0: it asked for
      # a package named `cv-core` that had become `clustervision-core`, and nothing noticed for a
      # whole release. This job is the thing that notices.
      - name: Check
        working-directory: app/src-tauri
        run: cargo check --all-targets
      - name: Test
        working-directory: app/src-tauri
        run: cargo test

  web:
    name: web UI (web/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      # `web/` has no build step and no framework, so nothing was ever checking that it parses —
      # or that it still matches the IR. Syntax is the floor; `web/selftest.html` carries the
      # rendering invariants, run headless below.
      - name: Syntax-check every module
        run: |
          set -euo pipefail
          found=0
          for f in web/*.js web/components/*.js; do
            [ -e "$f" ] || continue
            found=$((found + 1))
            node --check "$f"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::no web modules found — did the layout move?"
            exit 1
          fi
          echo "checked $found module(s)"
      # A content block is tagged `type` (§4); an EVENT still has a `kind`. This catches the
      # specific regression that broke every transcript screen in 0.11.0.
      - name: No block is read by the pre-0.11.0 tag
        run: |
          set -uo pipefail
          if grep -rnE '\.kind *=== *"(text|thinking|tool_use|tool_result|image|file)"' web/; then
            echo "::error::a content block is tagged 'type', not 'kind' — see docs/INTERFACE-V2.md §4"
            exit 1
          fi
          echo "no stale block-tag reads"
      # web/selftest.html in headless Chrome: every check passes and the page throws nothing.
      # playwright-core (no bundled browser) drives the Chrome the runner image ships, so this is
      # one small npm package, not a browser download.
      - name: Browser gate report controls
        run: python3 -I tools/test-web-selftest.py

      - name: Rendering self-test (headless Chrome)
        run: |
          set -euo pipefail
          npm install --no-save --ignore-scripts --prefix "$RUNNER_TEMP/pw" playwright-core@1.62.1
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" SELFTEST_CHANNEL=chrome node tools/web-selftest.mjs web
          NODE_PATH="$RUNNER_TEMP/pw/node_modules" SELFTEST_CHANNEL=chrome node tools/inbox-selftest.mjs
