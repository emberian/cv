[package]
name = "cv-sim"
description = "Synthetic fleet generator and replay-cost bench for the cv task substrate (dev-only, never published)."
publish = false
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Fence position: cv-sim may depend on cv-core; nothing depends on cv-sim.
[dependencies]
cv-core = { path = "../cv-core", version = "0.11", package = "clustervision-core" }
chrono.workspace = true
serde_json.workspace = true
thiserror.workspace = true
uuid.workspace = true
anyhow.workspace = true

[[bin]]
name = "cv-sim-bench"
path = "src/bin/cv-sim-bench.rs"
