# formats/pi.toml — the vocabulary cv's `pi` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm.
# tests/formats_manifest.rs holds it to the adapter source.

harness = "pi"
source_files = ["harness/pi.rs", "harness/pi/record.rs", "harness/wire/anthropic.rs", "harness/wire/mod.rs"]
# Role words and structural match literals that are not entry-type vocabulary.
ignore_literals = ["user", "assistant", "toolResult", "tool", "system", "image"]
store = [
  "$PI_CODING_AGENT_DIR/sessions/**/*.jsonl",
  "$HOME/.pi/agent/sessions/**/*.jsonl",
  "an explicit pool RUNDIR's sessions/**/*.jsonl (with_roots)",
]

[upstream]
repo = "pi-coding-agent (linuxbrew install; docs/session-format.md)"
commit = "1.0.2"
date = "2026-11-19"

[types]
"role.user" = { status = "generic", note = "" }
"role.assistant" = { status = "generic", note = "" }
"role.toolResult" = { status = "generic", note = "toolCallId, toolName, isError and details map to Block::ToolResult; image parts keep Block::Image" }
"role.system" = { status = "generic", note = "pre-compaction system prompt -> MessageKind::SystemPrompt + Session::system_prompt; compaction systemMessage carried in extra[pi]" }
"block.text" = { status = "generic", note = "" }
"block.thinking" = { status = "generic", note = "" }
"block.toolCall" = { status = "generic", note = "arguments, not input" }
"block.image" = { status = "generic", note = "" }
"thinking.redacted" = { status = "handled", note = "redacted thinking item -> Block::Thinking{redacted}" }
"tree.parentId" = { status = "handled", note = "the projection walks the leaf's parent chain; the latest compaction's firstKeptEntryId bounds it" }
"tree.leaf" = { status = "generic", note = "the last entry is the default leaf (Pi's own rule); no literal names it" }
"entry.context_edit" = { status = "carried", note = "projected onto targetId in lean reads (null drops, object swaps content); raw edit record carried under complete" }
"writer" = { status = "ignored", note = "the writer is not implemented; the reader is the first deliverable" }
