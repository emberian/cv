# formats/claude.toml — the vocabulary cv's `claude` adapter is checked against (docs/INTERFACE-V2.md §7).
# Lists only what the source cannot say: an item the adapter has a match arm for is `handled` by inference and is
# not listed. generic = interpreted by a blanket rule; carried = verbatim under ParseOptions::complete only;
# ignored = known and deliberately skipped; handled = interpreted, but not by a match arm (a SQL identifier, a path).
# tests/formats_manifest.rs holds it to the adapter source.

harness = "claude"
source_files = ["harness/claude.rs", "harness/claude/record.rs", "harness/claude_workflow.rs", "harness/wire/anthropic.rs", "harness/wire/mod.rs"]
ignore_literals = ["jsonl", "json"]
store = [
  "~/.claude/projects/<encoded-cwd>/<sessionId>.jsonl",
  "~/.claude/projects/<encoded-cwd>/<sessionId>/subagents/agent-*.jsonl",
  "~/.claude/projects/<encoded-cwd>/<sessionId>/subagents/workflows/<run>/agent-*.jsonl",
  "~/.claude/projects/<encoded-cwd>/<sessionId>/workflows/<run>.json",
  "~/.claude/projects/<encoded-cwd>/<sessionId>/tool-results/<id>.txt",
  "~/.claude/history.jsonl",
  "~/.claude/sessions/<pid>.json",
]

[upstream]
repo = "Claude Code (Bun binary, ~/.local/share/claude/versions/<v>; npm @anthropic-ai/claude-code)"
commit = "2.1.323 (corpus tests/corpus/claude/2.1.304; earlier 2.1.296, 2.1.278)"
date = "2026-11-12"

[types]
summary = { status = "generic", note = "sets session title fallback; carried under complete" }
"ai-title" = { status = "generic", note = "sets session title; carried under complete" }
"custom-title" = { status = "generic", note = "sets user session title; carried under complete" }
"continued-in" = { status = "generic", note = "sets lineage.continued_in; carried under complete" }
"fork-context-ref" = { status = "generic", note = "sets fork lineage + fork_context; carried under complete" }
"agent-name" = { status = "generic", note = "sets session extra agent_name; carried under complete" }
tag = { status = "generic", note = "sets session extra tag; carried under complete" }
relocated = { status = "generic", note = "sets session extra relocated_cwd; carried under complete" }
"pr-link" = { status = "generic", note = "appends session extra pr_links; carried under complete" }
mode = { status = "carried", note = "UI mode" }
"permission-mode" = { status = "carried", note = "permission mode" }
"atis-latch" = { status = "carried", note = "latch state" }
"isolation-latch" = { status = "carried", note = "isolation side latch {side} (2.1.30x)" }
"api-request" = { status = "carried", note = "request ledger (2.1.300+): one per API call — params, base/keep + tail blob hashes, cacheControl, requestDigest" }
"api-request-shape" = { status = "carried", note = "request ledger: the system prompt + tool schemas one or more requests sent, keyed by shapeHash" }
"api-request-blob" = { status = "carried", note = "request ledger: one request message keyed by hash; its `message` is a request body, never a turn" }
