"system.turn_duration" = { status = "ignored", note = "bodyless turn timing; carried under complete" }
"system.agents_killed" = { status = "ignored", note = "bodyless agent cleanup; carried under complete" }
"system.away_summary" = { status = "generic", note = "no arm of its own: the `_` arm of system_msg makes every other subtype a Notice/Harness" }
