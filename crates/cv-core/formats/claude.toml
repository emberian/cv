"worktree-state" = { status = "carried", note = "EnterWorktree/ExitWorktree state (2.1.29x); no arm: the bookkeeping `_` arm" }
progress = { status = "carried", note = "legacy sub-agent telemetry" }
started = { status = "carried", note = "legacy sub-agent telemetry" }
result = { status = "carried", note = "legacy sub-agent telemetry / journal result" }
"x-quota" = { status = "carried", note = "quota record" }
"system.local_command" = { status = "handled", note = "slash command in/out" }
"system.stop_hook_summary" = { status = "generic", note = "Stop hook output/error → Notice/Hook; carried under complete" }
"system.compact_boundary" = { status = "generic", note = "→ CompactionBoundary; carried under complete" }
