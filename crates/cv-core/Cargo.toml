[package]
name = "clustervision-core"
description = "Unified parser and intermediate representation for AI coding-agent session transcripts across harnesses (Claude Code, Codex, Grok, OpenCode, Gemini)."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# Keep the Rust crate name `cv_core` even though the crates.io package is
# `clustervision-core` (renamed off the taken `cv-core`). Dependents already
# alias it via `package = "clustervision-core"`, and this keeps the crate's own
# `tests/` (which `use cv_core::…`) compiling.
# The harness corpus is test data that grows with every harness version; it is not part of the
# published library.
exclude = ["tests/corpus"]
[lib]
name = "cv_core"

[dependencies]
zip = { version = "2.4", optional = true, default-features = false, features = ["deflate"] }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
thiserror.workspace = true
walkdir.workspace = true
percent-encoding.workspace = true
rusqlite = { workspace = true, optional = true, features = ["blob"] }
rayon = { workspace = true, optional = true }
dirs.workspace = true
uuid.workspace = true
regex.workspace = true
toml.workspace = true
# Line splitting on the parse paths (a byte loop was a quarter of a codex parse). Already in the
# tree through regex.
memchr = "2"
# Floor at 0.9.11 — RUSTSEC-2026-0186 patched there (advisory against 0.9.10).
memmap2 = { version = ">=0.9.11, <0.10", optional = true }

# Real OS advisory locks for the task log's lockfile (flock on unix, LockFileEx on windows) —
# already in the workspace tree via tantivy. wasm32 has neither file locking nor cross-process
# concurrency, so the store falls back to a plain open there.
[target.'cfg(not(target_family = "wasm"))'.dependencies]
fs4 = { version = "0.13", default-features = false, features = ["sync"] }
# libzstd decodes compressed sources natively (`store::zst`): already linked into the shipped
# binary through tantivy, and about 4x ruzstd's decode rate on Codex's compressed rollouts.
zstd = { version = "0.13", optional = true, default-features = false }

# uuid v4 generation needs a randomness source; on wasm32-unknown-unknown that means the JS
# crypto API via getrandom's `js` backend. Feature-gating it here (features unify per-target)
# makes `cargo check -p clustervision-core --no-default-features --target wasm32-unknown-unknown`
# work standalone instead of relying on cv-web to enable `uuid/js` for the whole graph.
# No-replace rename (`renamex_np`, `renameat2`) for publishing where hard links are unsupported.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_family = "wasm")'.dependencies]
uuid = { workspace = true, features = ["js"] }
# Pure-Rust zstd for wasm builds (`store::zst`); native builds use libzstd below.
ruzstd = { workspace = true, optional = true }

[features]
zip-ingest = ["dep:zip"]
default = ["sqlite", "parallel", "mmap", "zstd"]
# `mmap` resolves lazy content spans by memory-mapping the source file (only touched pages page in).
# Off for wasm32 (no mmap); the resolver falls back to a positioned ranged read, behavior identical.
mmap = ["dep:memmap2"]
# `sqlite` pulls in rusqlite (native C SQLite) for the SQLite-backed adapters (Hermes, Cursor,
# Goose, Zed, Devin) and the FTS index, plus a zstd decoder for compressed rollouts and blobs.
# Disable it (e.g. `--no-default-features`) to compile cv-core for wasm32.
sqlite = ["dep:rusqlite", "zstd"]
# Compressed sources are independent of SQL stores; native libzstd, portable ruzstd.
zstd = ["dep:ruzstd", "dep:zstd"]
# `parallel` fans discovery across adapters/files with rayon. Off for wasm32 (no threads); the code
# has a sequential fallback so behavior is identical, just slower.
parallel = ["dep:rayon"]
# Diagnostic example only: count requested Rust allocations separately from clean timing runs.
probe-heap = []
# Integration-test observations at the resume reader; absent from normal builds.
probe-resume = ["sqlite"]

# The golden corpus reads every harness's store, SQLite and zstd ones included.
[[test]]
name = "corpus"
required-features = ["sqlite"]

[dev-dependencies]
syn = { version = "2", features = ["full"] }
cv-testkit = { path = "../cv-testkit" }
