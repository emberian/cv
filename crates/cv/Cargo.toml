[package]
name = "clustervision"
description = "clustervision CLI — search, read, and port AI coding-agent sessions across harnesses."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cv"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "io-util"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io", "io-util"] }
futures-util = "0.3"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }

# SIGPIPE reset: a Rust binary piped into `head`/`grep -q` panics on broken pipe by
# default; a CLI whose output is made for pipes must die quietly like every other
# unix tool. Unix-only (no-op dep elsewhere).
libc = "0.2"
cv-core = { path = "../cv-core", version = "0.19.3", package = "clustervision-core" }
cv-search = { path = "../cv-search", version = "0.19.3" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
uuid.workspace = true
# `cmd/hooks.rs`: Codex's `[hooks.state]` trust store (TOML) and its identity hash.
toml.workspace = true
# `cv serve`'s banner encodes its query string.
urlencoding = "2"

[dev-dependencies]
rusqlite.workspace = true
cv-testkit = { path = "../cv-testkit" }

[features]
# Isolated ignored-test diagnostics; ordinary binaries retain the system allocator.
probe-heap = []
