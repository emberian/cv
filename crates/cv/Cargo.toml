[package]
name = "clustervision"
description = "clustervision CLI — search, read, and port AI coding-agent sessions across harnesses."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "cv"
path = "src/main.rs"

[dependencies]
# SIGPIPE reset: a Rust binary piped into `head`/`grep -q` panics on broken pipe by
# default; a CLI whose output is made for pipes must die quietly like every other
# unix tool. Unix-only (no-op dep elsewhere).
libc = "0.2"
cv-core = { path = "../cv-core", version = "0.19.0", package = "clustervision-core" }
cv-search = { path = "../cv-search", version = "0.19.0" }
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
uuid.workspace = true
# `cmd/hooks.rs`: Codex's `[hooks.state]` trust store (TOML) and its identity hash.
toml.workspace = true
# `cv serve`'s banner encodes its query string; the server itself (`src/http.rs`) is std-only.
urlencoding = "2"

[dev-dependencies]
rusqlite.workspace = true
cv-testkit = { path = "../cv-testkit" }

[features]
# Isolated ignored-test diagnostics; ordinary binaries retain the system allocator.
probe-heap = []
