[package]
name = "cv-web"
description = "WASM bindings for clustervision — ingest an uploaded harness zip in the browser and return sessions as JSON."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Browser artifact: built with wasm-pack and served as part of the web viewer, never consumed
# from crates.io. Keeping it unpublished also keeps the publish graph free of a cdylib.
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# no-default-features drops rusqlite so cv-core compiles to wasm32.
cv-core = { path = "../cv-core", version = "0.11", package = "clustervision-core", default-features = false }
wasm-bindgen = "0.2"
serde_json.workspace = true
# In-memory zip reader. default-features=false drops native codecs (bzip2/zstd/aes) that don't build
# for wasm32; the `deflate` feature (flate2's pure-Rust backend) covers standard zip entries.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
# cv-core depends on `uuid` (used in emit.rs). On wasm32 uuid needs a randomness source; enabling its
# `js` feature here (features unify across the dep graph) wires v4 generation to the JS crypto API.
uuid = { workspace = true, features = ["js"] }
