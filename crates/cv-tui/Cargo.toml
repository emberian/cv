[package]
name = "cv-tui"
description = "clustervision TUI — a terminal browser for agent sessions (search, read, scry, board)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
# Distributed as a prebuilt binary via cargo-dist releases; not published to crates.io
# (young surface, no library API — revisit once the TUI stabilizes).
publish = false

# dist's default heuristic drops publish = false packages from releases; cv-tui still ships
# as a prebuilt release binary, so opt it back in explicitly.
[package.metadata.dist]
dist = true

[[bin]]
name = "cv-tui"
path = "src/main.rs"

[dependencies]
cv-core = { path = "../cv-core", version = "0.11", package = "clustervision-core" }
cv-search = { path = "../cv-search", version = "0.11" }
anyhow.workspace = true
chrono.workspace = true
dirs.workspace = true
ratatui = "0.29"
crossterm = "0.28"

[dev-dependencies]
# Already in the workspace dependency set; tests build tool-call inputs (serde_json::Value).
serde_json.workspace = true
