[package]
name = "cv-search"
description = "Pure-Rust full-text (tantivy) + semantic (embeddings) search over clustervision sessions."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cv-core = { path = "../cv-core", version = "0.18.0", package = "clustervision-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true

# Full-text: pure-Rust Lucene-like engine. Always on.
tantivy = "0.26"

# Semantic: distilled *static* embeddings (model2vec). Tiny, no ONNX runtime — just
# `tokenizers` + `safetensors` + `ndarray`. `hf-hub` lets us fetch + cache a small model
# (e.g. potion-base-8M, ~30MB) on first use. Gated so a minimal FTS-only build is possible
# via `--no-default-features`.
hf-hub = { version = "0.4.3", default-features = false, features = ["ureq"], optional = true }
model2vec-rs = { version = "0.2", default-features = false, features = ["onig", "hf-hub"], optional = true }

[features]
default = ["semantic"]
semantic = ["dep:model2vec-rs", "dep:hf-hub"]
# Isolated ignored sweep oracle: requested Rust heap and production document chunk size.
probe-heap = []

[dev-dependencies]
cv-core = { path = "../cv-core", version = "0.18.0", package = "clustervision-core", features = ["probe-resume"] }
dirs.workspace = true
cv-testkit = { path = "../cv-testkit" }
rusqlite.workspace = true
zstd = { version = "0.13", default-features = false }
