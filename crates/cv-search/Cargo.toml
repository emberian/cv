[package]
name = "cv-search"
description = "Pure-Rust full-text (tantivy) and exact trigram search over clustervision sessions."
readme.workspace = true
keywords.workspace = true
categories.workspace = true
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
cv-core = { path = "../cv-core", version = "0.20.0", package = "clustervision-core" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
uuid.workspace = true
memchr = "2"

# Full-text and roaring posting sets.
tantivy = "0.26"
roaring = "0.12"

[features]
# Isolated ignored sweep oracle: requested Rust heap and production document chunk size.
probe-heap = []

[dev-dependencies]
dirs.workspace = true
cv-testkit = { path = "../cv-testkit" }
rusqlite.workspace = true
zstd = { version = "0.13", default-features = false }
