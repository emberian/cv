[book]
title = "clustervision — the manual"
authors = ["ember"]
description = "Find, read, search, port, and visualize every AI coding-agent session, across every harness."
src = "src"
language = "en"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/emberian/cv"
edit-url-template = "https://github.com/emberian/cv/edit/main/manual/{path}"
additional-css = ["theme/cv.css"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true

# `{{#cv-commands}}` and `{{#cv-command-map}}`: the reference and command map, generated from the
# built binary (`$CV_BIN`, else `target/debug/cv`). Build cv before the book.
[preprocessor.cv]
command = "python3 ../tools/mdbook-cv.py"

# Pages that were merged into others keep answering at their old URLs (the web app links one).
[output.html.redirect]
"/introduction.html" = "getting-started.html"
"/daemon.html" = "serving.html"
"/app.html" = "viewing-and-sharing.html"
"/share.html" = "viewing-and-sharing.html#sharing-a-transcript-cv-share"
"/integrations.html" = "hooks.html"
"/mcp.html" = "hooks.html"
"/opensession.html" = "conversion.html#the-opensession-standard"
