# formats/lmstudio.toml — the vocabulary cv's `lmstudio` adapter is checked against (docs/INTERFACE-V2.md §7).
# status: handled = per-item arm in the adapter; generic = interpreted by a blanket rule; carried = verbatim
# under ParseOptions::complete only; ignored = known and deliberately skipped. Regenerate: tools/gen-manifests (or edit by hand).

harness = "lmstudio"
source_files = ["harness/lmstudio.rs"]
ignore_literals = ["Untitled"]
store = [
  "~/.lmstudio/conversations/<ms-epoch>.conversation.json",
]

[upstream]
repo = "closed source"
commit = "unknown"
date = "2026-05-29"

[types]
"role.user" = { status = "handled", note = "singleStep" }
"role.assistant" = { status = "generic", note = "multiStep" }
"role.system" = { status = "handled", note = "" }
"message.singleStep" = { status = "generic", note = "" }
"message.multiStep" = { status = "generic", note = "" }
"block.contentBlock" = { status = "generic", note = "style.type thinking → reasoning" }
"field.llm.prediction.systemPrompt" = { status = "handled", note = "system prompt" }
"part.text" = { status = "generic", note = "" }
"part.file" = { status = "generic", note = "" }
"file.image" = { status = "handled", note = "part `fileType` == image -> Block::Image, anything else -> Block::File" }
"style.thinking" = { status = "handled", note = "contentBlock `style.type` == thinking -> Block::Thinking" }
