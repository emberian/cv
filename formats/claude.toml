# Store layout the adapter walks (see `store` above) — path segments, not record types.
"path.subagents" = { status = "handled", note = "<sessionId>/subagents/agent-*.jsonl" }
"path.workflows" = { status = "handled", note = "<sessionId>/subagents/workflows/<run>/" }
"assistant.synthetic" = { status = "generic", note = "model `<synthetic>` / isApiErrorMessage → System notice or error" }
