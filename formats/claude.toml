"attachment.silent_turn_reminder" = { status = "generic", note = "rendered → injected context" }
"attachment.edited_text_file" = { status = "generic", note = "rendered → injected context" }
"attachment.task_reminder" = { status = "generic", note = "rendered → injected context" }
