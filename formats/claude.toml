"attachment.thinking_drop" = { status = "generic", note = "rendered → injected context" }
"attachment.deferred_tools_record" = { status = "generic", note = "rendered → injected context" }
"attachment.hook_cancelled" = { status = "generic", note = "rendered → injected context" }
"attachment.hook_system_message" = { status = "generic", note = "rendered → injected context" }
"attachment.hook_additional_context" = { status = "generic", note = "rendered → injected context" }
