# formats/continue.toml — the vocabulary cv's `continue` adapter is checked against (docs/INTERFACE-V2.md §7).
# status: handled = per-item arm in the adapter; generic = interpreted by a blanket rule; carried = verbatim
# under ParseOptions::complete only; ignored = known and deliberately skipped. Regenerate: tools/gen-manifests (or edit by hand).

harness = "continue"
source_files = ["harness/continuedev.rs"]
ignore_literals = ["sessions.json"]
store = [
  "$CONTINUE_GLOBAL_DIR or ~/.continue/sessions/{sessions.json,<id>.json}",
]

[upstream]
repo = "https://github.com/continuedev/continue (not checked out)"
commit = "unknown"
date = "2026-05-29"

[types]
"role.user" = { status = "handled", note = "" }
"role.assistant" = { status = "handled", note = "" }
"role.system" = { status = "handled", note = "" }
"role.tool" = { status = "handled", note = "toolCallId" }
"part.text" = { status = "handled", note = "" }
"part.imageUrl" = { status = "handled", note = "" }
"field.toolCalls" = { status = "generic", note = "" }
"field.contextItems" = { status = "generic", note = "→ File" }
