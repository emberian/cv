[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.31.0"
# CI backends to support
ci = "github"
# Publish to crates.io as part of the release (in addition to the GitHub release artifacts).
# Without this, crates.io lagged the tag: v0.9.22 shipped binaries while crates.io sat at 0.9.21.
#
# This MUST be the custom job `./publish-crates` (`.github/workflows/publish-crates.yml`), not the
# plausible-looking `"cargo"`. cargo-dist 0.31 has no built-in crates.io job — it accepts only
# `homebrew`, `npm`, and `./name` — and rejects anything else while PARSING this file, so the
# `plan` step dies before a single artifact is built. That is what happened: the value was
# `"cargo"` from just after v0.9.22 until 0.11.0, every tag in between produced nothing, and the
# failure looked like a TOML error rather than a missing feature. `dist plan` locally is the
# cheapest way to catch a repeat.
publish-jobs = ["./publish-crates"]
# The installers to generate for each app
installers = ["shell", "powershell"]
# Target platforms to build apps for (Rust target-triple syntax)
# macOS arm64/x64, Linux arm64/x64/x86, Windows x64/x86.
# NOTE: aarch64-pc-windows-msvc is intentionally omitted — `ring` (the C crypto lib behind rustls)
# fails to cross-compile to Windows-ARM64 via cargo-xwin (clang rejects the `/imsvc` MSVC include
# flag in GNU mode). All other 7 targets build clean. Re-add if/when the toolchain is fixed.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "i686-unknown-linux-gnu",
    "x86_64-pc-windows-msvc",
    "i686-pc-windows-msvc",
]
