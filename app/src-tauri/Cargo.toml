# Standalone cargo workspace for the clustervision Tauri v2 desktop app.
#
# This deliberately declares its OWN `[workspace]` so it is EXCLUDED from the main
# clustervision workspace at the repo root — building/CI of the main crates can't be
# affected by (and isn't affected by) this app, and vice-versa. The app depends on the
# main crates by relative path (`../../crates/...`).
[workspace]

[package]
name = "clustervision-app"
description = "clustervision desktop app — Tauri v2 shell around the web UI + native cv-core/cv-llm power."
version = "0.11.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["ember"]

# The Tauri runtime lives in lib.rs (so mobile targets can reuse it); main.rs is a thin wrapper.
[lib]
name = "clustervision_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `devtools`: keep the View → Toggle DevTools menu item working in release bundles too
# (otherwise the open/close_devtools APIs are debug-only).
tauri = { version = "2", features = ["devtools"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"

# Native in-memory zip ingestion (Open zip… menu item). No default features: we only
# need stored/deflate reading, not the heavy optional codecs.
zip = { version = "2", default-features = false, features = ["deflate"] }

# The native power: pull in the workspace crates by relative path so the desktop app can
# call distill/redact/generate without shipping API keys into JS.
# NOTE: `cv-core`'s package name is `clustervision-core` (renamed for crates.io); the local alias
# stays `cv_core` via `package = `, exactly as `crates/cv/Cargo.toml` does it.
cv-core = { path = "../../crates/cv-core", package = "clustervision-core" }
cv-llm = { path = "../../crates/cv-llm" }
cv-search = { path = "../../crates/cv-search" }

[dev-dependencies]
# Fixture transcripts for the `local_*` JSON-shaping tests live in a scratch dir, never the store.
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
